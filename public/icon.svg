<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep slate to rich dark space blue -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#141424" />
    </linearGradient>
    <!-- Gold Gradient: Premium warm aether metallic shine -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F27D26" />
      <stop offset="100%" stop-color="#B26A14" />
    </linearGradient>
    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Geometric Decorative Lines (Sanctuary / Gallery structure) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.15" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.25" />
  
  <!-- Central Emblem: Elegant intersecting triangles (the 'A' of Aether and divine geometry) -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#glow)">
    <!-- Outer Triangle (Upward, pointing to sky/divinity) -->
    <polygon points="0,-100 86.6,50 -86.6,50" fill="none" stroke="url(#gold-grad)" stroke-width="12" stroke-linejoin="round" />
    <!-- Inner Intersecting Diamond / Star core -->
    <polygon points="0,-40 34.6,20 0,80 -34.6,20" fill="url(#gold-grad)" opacity="0.85" />
    <!-- Core glowing node -->
    <circle cx="0" cy="20" r="12" fill="#FFFFFF" />
  </g>
</svg>
