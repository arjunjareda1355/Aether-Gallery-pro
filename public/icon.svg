<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep slate to rich dark space obsidian -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#121218" />
    </linearGradient>
    <!-- Gold Gradient: Premium warm aether metallic shine -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="40%" stop-color="#F27D26" />
      <stop offset="100%" stop-color="#D9620E" />
    </linearGradient>
    <!-- Subtle Ambient Glow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container (Squircle) -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" stroke="#ffffff" stroke-width="6" stroke-opacity="0.08" />
  
  <!-- Subtle Sanctuary Orbit -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.18" stroke-dasharray="8 6" />
  
  <!-- Central Emblem: Precision 'Æ' Monogram Geometry -->
  <g transform="translate(256, 256)" filter="url(#subtle-glow)">
    <!-- Upward Apex Triangle -->
    <polygon points="0,-110 95,55 -95,55" fill="none" stroke="url(#gold-grad)" stroke-width="14" stroke-linejoin="round" />
    <!-- Inner Core Diamond -->
    <polygon points="0,-35 40,25 0,85 -40,25" fill="url(#gold-grad)" opacity="0.9" />
    <!-- Core Pure Light Center -->
    <circle cx="0" cy="25" r="10" fill="#FFFFFF" />
  </g>
</svg>

