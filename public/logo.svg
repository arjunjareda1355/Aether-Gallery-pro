<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Purple to Blue Gradient for Monogram -->
    <linearGradient id="ag-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Gradient for the PRO badge -->
    <linearGradient id="pro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Star Glow / Color -->
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Canvas -->
  <rect width="1024" height="1024" fill="#FFFFFF" />

  <!-- Monogram AG Symbol -->
  <g fill="none" stroke="url(#ag-grad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Arc of 'G' -->
    <path d="M 495 282 C 550 250, 640 250, 695 320" />

    <!-- Interlocking 'A' and 'G' Base Flow -->
    <path d="M 322 505 L 458 252 L 565 470 C 585 510, 640 515, 680 485 C 708 460, 712 425, 712 390 L 602 390" />
  </g>

  <!-- 4-Pointed Sparkle Star Inside 'A' -->
  <g transform="translate(456, 435)" fill="url(#star-grad)">
    <path d="M 0 -34 Q 0 0, 34 0 Q 0 0, 0 34 Q 0 0, -34 0 Q 0 0, 0 -34 Z" />
  </g>

  <!-- Main Brand Name: A E T H E R -->
  <text 
    x="512" 
    y="630" 
    text-anchor="middle" 
    fill="#111827" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="64" 
    font-weight="600" 
    letter-spacing="0.42em"
  >AETHER</text>

  <!-- Subtitle: — G A L L E R Y — -->
  <g transform="translate(512, 682)">
    <line x1="-200" y1="-7" x2="-140" y2="-7" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <text 
      x="0" 
      y="0" 
      text-anchor="middle" 
      fill="#6D28D9" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="28" 
      font-weight="500" 
      letter-spacing="0.48em" 
      opacity="0.9"
    >GALLERY</text>
    <line x1="140" y1="-7" x2="200" y2="-7" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- PRO Badge -->
  <g transform="translate(512, 740)">
    <rect x="-65" y="-22" width="130" height="44" rx="22" fill="url(#pro-grad)" />
    <text 
      x="0" 
      y="8" 
      text-anchor="middle" 
      fill="#FFFFFF" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="20" 
      font-weight="800" 
      letter-spacing="0.25em"
    >PRO</text>
  </g>
</svg>
